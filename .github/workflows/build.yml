# Builds vsemvamdam-switcher on every push / PR and runs the tests.
# Publishes a GitHub Release with the .exe:
#   - on a push to main when src/version.h has a version that has no release yet (tag is created automatically), or
#   - when a tag like v1.2.3 is pushed.
name: build

on:
  push:
    branches: ["**"]   # every branch is built and tested; releases come only from main / tags (see the release job)
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (MinGW-w64) + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/.*VS_VER_STRING "\(.*\)".*/\1/p' src/version.h)" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y -q --no-install-recommends mingw-w64 zip

      - name: Check tag matches src/version.h
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(sed -n 's/.*VS_VER_STRING "\(.*\)".*/\1/p' src/version.h)
          TAG="${GITHUB_REF_NAME#v}"
          echo "version.h: $VER, tag: $TAG"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match VS_VER_STRING $VER in src/version.h"
            exit 1
          fi

      - name: Unit tests
        run: make test

      - name: Build exe
        run: make -j"$(nproc)"

      - name: Build Windows integration tests
        run: make wintest

      - name: Package
        run: |
          VER=$(sed -n 's/.*VS_VER_STRING "\(.*\)".*/\1/p' src/version.h)
          mkdir -p dist pkg
          cp build/vsemvamdam-switcher.exe dist/
          cp build/vsemvamdam-switcher.exe README.md LICENSE pkg/
          (cd pkg && zip -q -9 "../dist/vsemvamdam-switcher-$VER-win64.zip" vsemvamdam-switcher.exe README.md LICENSE)
          (cd dist && sha256sum vsemvamdam-switcher.exe "vsemvamdam-switcher-$VER-win64.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vsemvamdam-switcher
          path: dist/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: wintest
          path: |
            build/wintest.exe
            build/fake_client.exe
            build/net_probe.exe
          retention-days: 7

  windows-tests:
    name: Integration tests (real Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wintest
          path: build

      - name: Run integration tests
        shell: pwsh
        run: |
          cd build
          ./wintest.exe
          if ($LASTEXITCODE -ne 0) { throw "integration tests failed ($LASTEXITCODE)" }

      # Talks to the real Steam API without any account (server time, RSA key, a sign-in with a random name).
      # Informational: Steam being down must not block a release.
      - name: Steam Guard protocol smoke test
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          cd build
          $out = ./net_probe.exe
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Output $_ }
          $out | ForEach-Object { Write-Output "::notice title=Steam probe::$($_.Trim())" }
          "### Steam Guard protocol smoke test`n" + '```' + "`n" + ($out -join "`n") + "`n" + '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "Steam protocol smoke test reported a problem" }

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [build, windows-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsemvamdam-switcher
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then echo "::error::VS_VER_STRING not found in src/version.h"; exit 1; fi
          TAG="v$VERSION"
          cat > notes.md <<'EOF'
          **Скачать:** `vsemvamdam-switcher.exe` — один файл, установка не нужна.

          При первом запуске Windows SmartScreen может предупредить (файл не подписан): «Подробнее» → «Выполнить в любом случае».
          Контрольные суммы — в `SHA256SUMS.txt`.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              gh release upload "$TAG" dist/* --clobber
              echo "Updated assets of $TAG"
            else
              echo "Release $TAG already exists — bump VS_VER_STRING in src/version.h to publish a new one."
            fi
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "vsemvamdam switcher $VERSION" \
              --notes-file notes.md --generate-notes
            echo "Published $TAG"
          fi
